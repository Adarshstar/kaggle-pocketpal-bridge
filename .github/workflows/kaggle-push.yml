name: kaggle-push
# Re-pushes kaggle/bridge.py into the Kaggle notebook (restarts the LLM backend). Manual only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      BRIDGE_KEY: ${{ secrets.BRIDGE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q kaggle
      - run: python scripts/kaggle_push.py
