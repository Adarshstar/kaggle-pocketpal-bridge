use_default_settings: true
general:
  instance_name: "bridge-search"
  enable_metrics: false
server:
  secret_key: "overridden-by-SEARXNG_SECRET-env"
  limiter: false
  image_proxy: false
  bind_address: "0.0.0.0"
  port: 8080
search:
  safe_search: 0
  default_lang: "auto"
  formats:
    - html
    - json
outgoing:
  request_timeout: 5.0
  max_request_timeout: 10.0
  pool_connections: 50
